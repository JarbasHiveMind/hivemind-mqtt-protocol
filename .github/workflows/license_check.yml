name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    with:
      # paho-mqtt is dual-licensed "EPL-2.0 OR BSD-3-Clause"; we take the permissive
      # BSD-3-Clause option (Apache-2.0 compatible). pilosus flags the dual identifier
      # as WeakCopyleft on the EPL alternative, so exclude it by name. The package
      # itself is git-installed (no PyPI license metadata), so exclude it too.
      exclude_packages: "(?i:^(paho-mqtt|hivemind-mqtt-protocol)([=<>!~ @;].*)?$)"
