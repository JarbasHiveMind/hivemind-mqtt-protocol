name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      test_path: 'tests/'
      pre_install_pip: '"hivescope==0.5.0a2" "hivemind-plugin-manager==0.7.0a1" "hivemind-core==4.6.0a2" "hivemind-ovos-agent-plugin==0.3.0a4"'
