name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      pre_install_pip: '"hivemind-bus-client==0.9.2a1" "hivescope==0.5.0a2" "hivemind-plugin-manager==0.7.1a1" "hivemind-ovos-agent-plugin==0.3.1a1"'
      coverage_source: 'hivemind_mqtt_protocol'
      test_path: 'tests/'
      min_coverage: 0
